name: Build APK Android
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Construction de l'environnement PWA → APK
        run: |
          mkdir -p capacitor-app/www
          rsync -av --exclude='capacitor-app' --exclude='.git' --exclude='.github' ./ capacitor-app/www/
          cd capacitor-app
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/haptics @capacitor/local-notifications
          npm install -D @capacitor/cli
          cat > capacitor.config.json << JSONEOF
          {
            "appId": "com.brahim.testmastercode",
            "appName": "Testmastercode",
            "webDir": "www",
            "bundledWebRuntime": true
          }
          JSONEOF
          npx cap init "Testmastercode" "com.brahim.testmastercode" --web-dir www
          npx cap add android

      - name: 🔐 Détection et injection automatique des permissions
        run: |
          cd capacitor-app/www
          MANIFEST="../android/app/src/main/AndroidManifest.xml"
          add_permission() {
            local perm="$1"
            if ! grep -q "android.permission.$perm" "$MANIFEST"; then
              sed -i "/<manifest/a\    <uses-permission android:name=\"android.permission.$perm\" />" "$MANIFEST"
            fi
          }
          rm -f .need_*_shim
          add_permission "INTERNET"
          add_permission "ACCESS_NETWORK_STATE"
          if grep -rq -E "passerAppelDirect" .; then add_permission "CALL_PHONE"; touch .need_call_shim; fi
          if grep -rq -E "navigator\.vibrate|\.vibrate\(" .; then add_permission "VIBRATE"; touch .need_vibrate_shim; fi
          if grep -rq -E "navigator\.geolocation|getCurrentPosition|watchPosition" .; then
            add_permission "ACCESS_FINE_LOCATION"
            add_permission "ACCESS_COARSE_LOCATION"
            touch .need_geolocation_shim
          fi
          if grep -rq -E "getUserMedia.*video|video.*getUserMedia" .; then add_permission "CAMERA"; touch .need_camera_shim; fi
          if grep -rq -E "getUserMedia.*audio|audio.*getUserMedia" .; then add_permission "RECORD_AUDIO"; touch .need_microphone_shim; fi
          if grep -rq -E "new Notification\(|Notification\.requestPermission" .; then add_permission "POST_NOTIFICATIONS"; touch .need_notification_shim; fi

      - name: 📱 Configuration du pont d'appel natif
        run: |
          if [ -f capacitor-app/www/.need_call_shim ]; then
            cd capacitor-app
            MAIN_ACTIVITY="android/app/src/main/java/com/brahim/testmastercode/MainActivity.java"
            cat > $MAIN_ACTIVITY << 'EOF'
          package com.brahim.testmastercode;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              private static final int REQUEST_CALL_PHONE = 1234;
              private static final String TAG = "MainActivity";
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = this.bridge.getWebView();
                  webView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void passerAppelDirect(String phone) {
                          if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CALL_PHONE)
                                  != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(MainActivity.this,
                                      new String[]{Manifest.permission.CALL_PHONE},
                                      REQUEST_CALL_PHONE);
                              return;
                          }
                          try {
                              Intent intent = new Intent(Intent.ACTION_CALL);
                              intent.setData(Uri.parse("tel:" + phone));
                              startActivity(intent);
                          } catch (Exception e) { Log.e(TAG, "Échec", e); }
                      }
                  }, "AndroidBridge");
              }
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
              }
          }
          EOF
          fi

      - name: 🌉 Injection des shims
        run: |
          cd capacitor-app/www
          NEED_VIBRATE=false
          NEED_NOTIFICATION=false
          [ -f .need_vibrate_shim ] && NEED_VIBRATE=true
          [ -f .need_notification_shim ] && NEED_NOTIFICATION=true
          if [ "$NEED_VIBRATE" = "true" ] || [ "$NEED_NOTIFICATION" = "true" ]; then
            cat > shims.js << 'SHIMEOF'
          (function() {
            var Capacitor = window.Capacitor;
            console.log('🔌 Shims:', !!(Capacitor && Capacitor.Plugins) ? 'natif' : 'web');
          })();
          SHIMEOF
            if [ "$NEED_VIBRATE" = "true" ]; then
              cat >> shims.js << 'VIBEOF'
          (function() {
            var C = window.Capacitor;
            if (C && C.Plugins && C.Plugins.Haptics) {
              navigator.vibrate = function(p) {
                var d = (typeof p === 'number') ? p : (Array.isArray(p) && p.length) ? p[0] : 200;
                try { C.Plugins.Haptics.vibrate({ duration: d }); } catch(e) {}
                return true;
              };
            }
          })();
          VIBEOF
            fi
            if [ "$NEED_NOTIFICATION" = "true" ]; then
              cat >> shims.js << 'NOTIFEOF'
          (function() {
            var C = window.Capacitor;
            if (C && C.Plugins && C.Plugins.LocalNotifications) {
              C.Plugins.LocalNotifications.createChannel({
                id: 'default', name: 'Notifications', importance: 5, visibility: 1
              }).catch(function(){});
              window.Notification = function(title, options) {
                options = options || {};
                C.Plugins.LocalNotifications.schedule({
                  notifications: [{
                    id: Math.floor(Math.random() * 2147483647),
                    title: title || '',
                    body: options.body || '',
                    channelId: 'default',
                    schedule: { at: new Date(Date.now() + 1000) }
                  }]
                }).catch(function(){});
                return { close: function() {} };
              };
              window.Notification.requestPermission = function() {
                return C.Plugins.LocalNotifications.requestPermissions().then(function(r) {
                  return r.display === 'granted' ? 'granted' : 'denied';
                });
              };
              window.Notification.permission = 'default';
            }
          })();
          NOTIFEOF
            fi
          fi

      - name: 🔌 Injection du Bridge
        run: |
          cd capacitor-app/www
          MAIN_HTML=$(find . -maxdepth 1 -name "*.html" | head -n 1)
          if [ -n "$MAIN_HTML" ]; then
            curl -s -o bridge.js "https://raw.githubusercontent.com/mekeirish/APK-Creator/main/bridge.js" || true
            if [ -f "../node_modules/@capacitor/core/dist/capacitor.js" ]; then
              cp ../node_modules/@capacitor/core/dist/capacitor.js capacitor.js
            else
              touch capacitor.js
            fi
            node -e "
              const fs = require('fs');
              const h = '${MAIN_HTML}';
              let c = fs.readFileSync(h, 'utf8');
              let parts = c.split(/<\/body>/i);
              if (parts.length > 1) {
                let last = parts.pop();
                let s = '<script src="capacitor.js"><\/script>\n';
                if (fs.existsSync('shims.js')) s += '<script src="shims.js"><\/script>\n';
                s += '<script src="bridge.js"><\/script>\n</body>';
                fs.writeFileSync(h, parts.join('</body>') + s + last, 'utf8');
              } else {
                let a = '<script src="capacitor.js"><\/script>\n';
                if (fs.existsSync('shims.js')) a += '<script src="shims.js"><\/script>\n';
                a += '<script src="bridge.js"><\/script>\n';
                fs.appendFileSync(h, a);
              }
            "
          fi

      - name: 🔄 Sync assets Android
        run: |
          cd capacitor-app
          npx cap sync android

      - name: Génération icône
        run: |
          cd capacitor-app
          npm install -D @capacitor/assets
          mkdir -p assets
          if [ -f "../icon.png" ]; then
            cp ../icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

      - name: Résolution conflits Kotlin
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> capacitor-app/android/app/build.gradle

      - name: Compilation APK
        run: |
          cd capacitor-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer APK
        run: |
          cd capacitor-app/android/app/build/outputs/apk/debug/
          mv app-debug.apk Testmastercode-debug.apk

      - name: Publication en Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "capacitor-app/android/app/build/outputs/apk/debug/Testmastercode-debug.apk"
          tag: "latest"
          name: "Testmastercode Latest Build"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}